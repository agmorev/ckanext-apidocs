name: Tests
on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ckan-version: ['2.11', '2.12']
        experimental: [false]
        include:
          - ckan-version: 'master'
            experimental: true  # master is unstable, good to know if we are compatible

    name: ${{ matrix.experimental && '**Fail_Ignored** ' || '' }} CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-latest
    container:
      # The CKAN version tag of the Solr and Postgres containers should match
      # the one of the container the tests run on.
      image: ckan/ckan-dev:${{ matrix.ckan-version }}
      options: --user 0
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7

    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 1
        continue-on-error: ${{ matrix.experimental }}

      - name: Install requirements
        run: |
          pip install -e '.[dev]'
          # Replace default path to CKAN core config file with the one on the container
          sed -i -e 's|use = config:.*|use = config:/srv/app/src/ckan/test-core.ini|' test.ini
        timeout-minutes: 10
        continue-on-error: ${{ matrix.experimental }}

      - name: Setup extension
        run: |
          ckan -c test.ini db init
        continue-on-error: ${{ matrix.experimental }}

      - name: Run tests
        run: |
          pytest --ckan-ini=test.ini --cov=ckanext.apidocs --cov-report=term-missing --disable-warnings ckanext/apidocs/tests
        continue-on-error: ${{ matrix.experimental }}


