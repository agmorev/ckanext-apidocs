apidocs-js:
  filter: rjsmin
  output: ckanext-apidocs/%(version)s-apidocs.js
  contents:
    - js/apidocs.js
    - js/swagger-initializer.js
    - js/swagger-ui-bundle.js
    - js/swagger-ui-standalone-preset.js
  extra:
    preload:
      - base/main

apidocs-css:
  filter: cssrewrite
  output: ckanext-apidocs/%(version)s-apidocs.css
  contents:
    - css/apidocs.css
    - css/swagger-ui.css

apidocs-admin-js:
  filter: rjsmin
  output: ckanext-apidocs/%(version)s-apidocs-admin.js
  contents:
    - js/apidocs-schema-editor.js
  extra:
    preload:
      - base/main
